<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محاكي قرار سوريا: من التحرير إلى 2027</title>
<style>
:root{
  --bg:#0d1117; --panel:#161d27; --panel2:#1c2532; --line:#2a3646;
  --txt:#e8eef6; --dim:#93a3b5; --gold:#e3b341; --green:#3fb96b;
  --red:#e05b5b; --blue:#4aa3e0; --w:#b48ce8; --a:#5ad08a; --s:#4aa3e0; --d:#e3b341; --e:#f0864f;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;line-height:1.8}
.wrap{max-width:980px;margin:0 auto;padding:22px 16px 60px}
h1{font-size:1.9rem;color:var(--gold);margin-bottom:6px}
h2{font-size:1.25rem;margin:14px 0 8px}
.sub{color:var(--dim);margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
.badge{display:inline-block;background:var(--panel2);border:1px solid var(--line);color:var(--gold);border-radius:20px;padding:2px 14px;font-size:.85rem;margin-bottom:10px}
.gauges{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:14px 0}
.gauge{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.gauge .lbl{font-size:.8rem;color:var(--dim);display:flex;justify-content:space-between}
.bar{height:10px;background:#0a0f16;border-radius:6px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;transition:width .5s}
.opt{display:block;width:100%;text-align:right;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;font-size:1rem;font-family:inherit}
.opt:hover{border-color:var(--gold);background:#222d3c}
.opt b{color:var(--gold);display:block;margin-bottom:4px}
.opt small{color:var(--dim)}
.btn{background:var(--gold);color:#141a22;font-weight:700;border:none;border-radius:10px;padding:12px 26px;font-size:1.05rem;cursor:pointer;font-family:inherit}
.btn.sec{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
.outcome{border-right:4px solid var(--blue);background:var(--panel2);border-radius:0 10px 10px 0;padding:14px 16px;margin:12px 0}
.reality{border-right:4px solid var(--green);background:#152219;border-radius:0 10px 10px 0;padding:14px 16px;margin:12px 0;font-size:.95rem}
.reality b{color:var(--green)}
.effs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.eff{font-size:.85rem;padding:2px 10px;border-radius:12px}
.eff.up{background:#12331f;color:#6fdc8c}.eff.dn{background:#3a1a1a;color:#f08c8c}
.tl{display:flex;align-items:center;gap:4px;margin:10px 0;font-size:.75rem;color:var(--dim)}
.tl .dot{flex:1;height:6px;background:#0a0f16;border-radius:4px;overflow:hidden}
.tl .dot i{display:block;height:100%;background:var(--gold)}
.log{font-size:.85rem;color:var(--dim)}
.log div{border-bottom:1px dashed var(--line);padding:4px 0}
.kbd{border:1px solid var(--line);border-radius:4px;padding:0 6px;background:var(--panel2);font-size:.8rem}
.big{font-size:2.2rem;color:var(--gold);margin:10px 0}
.center{text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
ul{padding-right:22px;margin:8px 0}
li{margin-bottom:6px}
.finalgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.tag{font-size:.8rem;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px 10px;color:var(--dim);display:inline-block;margin:2px}
</style>
</head>

 isis:"المسار الحقيقي: عمليات مشتركة مع التحالف (79 عملية في 2025، 203 معتقلين)، مع تهديد البادية قائماً.",
 israel2:"المسار الحقيقي: الوضع مجمد — لا اتفاق أمن ولا تطبيع، وغارات إسرائيلية على مواقع عسكرية حتى أغسطس 2026."
};

let state;
function newState(){state={g:{w:40,a:35,s:55,d:30,e:25},flags:new Set(),log:[],idx:0,pending:null};}

function apply(e){for(const k in e){state.g[k]=Math.max(0,Math.min(100,state.g[k]+e[k]));}}
function effHtml(e){let h='<div class="effs">';for(const k in e){const v=e[k];h+='<span class="eff '+(v>0?'up':'dn')+'">'+NAMES[k]+': '+(v>0?'+':'')+v+'</span>';}return h+'</div>';}

function gauges(){
 let h='<div class="gauges">';
 for(const k of ["w","a","s","d","e"]){const v=state.g[k];
  h+='<div class="gauge"><div class="lbl"><span>'+NAMES[k]+'</span><span>'+v+'</span></div><div class="bar"><i style="width:'+v+'%;background:'+COL[k]+'"></i></div></div>';}
 return h+'</div>';
}
function timeline(){
 const pct=Math.min(100,Math.round(state.idx/SCEN.length*100));
 return '<div class="tl"><span>ديسمبر 2024</span><div class="dot"><i style="width:'+pct+'%"></i></div><span>نهاية 2027</span></div>';
}

function showStart(){
 state=newState();
 document.getElementById("app").innerHTML=
 '<div class="card center"><h1>🇸🇾 محاكي قرار: سوريا</h1><div class="sub">من لحظة التحرير (8 ديسمبر 2024) حتى نهاية 2027</div>'+
 '<p style="text-align:right">أنت <b>رئيس المرحلة الانتقالية</b>. كل ملف على طاولتك هو ملف حدث فعلاً في تاريخ سوريا الحديث. لديك <b>24 قراراً مفصلياً</b> — لكل منها مسار حقيقي وقع فعلاً (سنكشفه بعد قرارك للمقارنة).</p>'+
 '<p style="text-align:right">توازناتك تُقاس بمؤشرات: <span class="tag">التماسك الوطني</span> <span class="tag">الأمن</span> <span class="tag">الشرعية الداخلية</span> <span class="tag">الاعتراف الدولي</span> <span class="tag">الاقتصاد</span>. مؤشراتك الأولى متواضعة لأن الدولة ورثت دمار حرب أهلية كاملة.</p>'+
 '<p style="text-align:right;color:var(--dim)">نصيحة: لا توجد إجابة مثالية — كل قرار يدفع ثمناً من رصيد آخر. هذه هي طبيعة الحكم في مرحلة انتقالية.</p>'+
 '<br><button class="btn" onclick="play()">ابدأ المرحلة الانتقالية</button></div>';
}
function play(){state=newState();showScen();}
function showScen(){
 const s=SCEN[state.idx];
 document.getElementById("app").innerHTML=
 '<div class="card">'+
 '<div class="badge">📅 '+s.date+'</div><h2 style="font-size:1.5rem">'+s.title+'</h2>'+timeline()+gauges()+
 '<p style="margin:10px 0">'+s.brief+'</p>'+
 s.opts.map((o,i)=>'<button class="opt" onclick="choose('+i+')"><b>'+(i+1)+'. '+o.t+'</b>'+(o.d?'<small>'+o.d+'</small>':'')+'</button>').join('')+
 '</div>';
 state.pending=s;
}
function choose(i){
 const s=state.pending,o=s.opts[i];
 apply(o.eff);
 (o.flags||[]).forEach(f=>state.flags.add(f));
 state.log.push('['+s.date+'] '+s.title+' → '+o.t);
 let flagsHtml=[...state.flags].length?'<div style="margin-top:6px">'+[...state.flags].map(f=>'<span class="tag">أثر: '+f+'</span>').join('')+'</div>':'';
 document.getElementById("app").innerHTML=
 '<div class="card">'+
 '<div class="badge">📅 '+s.date+' — '+s.title+'</div>'+
 '<h2>القرار: '+o.t+'</h2>'+
 '<div class="outcome"><b>النتيجة:</b> '+o.res+effHtml(o.eff)+flagsHtml+'</div>'+
 '<div class="reality"><b>ماذا حدث فعلاً؟</b><br>'+(REAL[s.id]||'')+'</div>'+
 gauges()+
 '<div style="margin-top:14px"><button class="btn" onclick="next()">'+(state.idx<SCEN.length-1?'المحطة التالية ←':'شاهد مصير سوريا (2027)')+'</button> <button class="btn sec" onclick="showStart()">إعادة من البداية</button></div>'+
 '</div>';
}
function next(){state.idx++; if(state.idx>=SCEN.length){ending();}else{showScen();}}

function ending(){
 const g=state.g,avg=Math.round((g.w+g.a+g.s+g.d+g.e)/5);
 let title,desc,diags=[];
 const realScore="في تاريخ سوريا الحقيقي (ديسمبر 2026) بدت المؤشرات: تماسك متصدّع (ساحل/سويداء)، أمن متوتر، شرعية داخلية مقبولة (استطلاع 69%رضا) وحول البرلمان ضعيفة، اعتراف دولي مرتفع جداً (شطب الإرهاب وواشنطن)، اقتصاد متعافٍ (نمو 10%) وقاعدة فقراء 90%.";
 if(g.a<20||g.w<20||g.s<20){
  title="الانهيار الثاني";
  desc="سقطت المرحلة الانتقالية في دوامة صراع مسلح أو تمرّد مركّب: حرب لم تبدأ في 2011 انتهت في 2027؛ بل بدأت من جديد بأطراف جديدة. الدولة التي حررت تحولت إلى ساحة.";
  diags=["مؤشر حرج تحت 20 = فقدان احتكار القوة أو الثقة"];
 }else if(avg>=70){
  title="العبور الذهبي ✨";
  desc="أنهيت 2027 بسوريا موحدة، معترف بها دولياً، واقتصادها يصعد وقواعد الحكم فيها مفوضة شعبياً. أنجزت ما عجزت عنه كل مراحل الانتقال في المنطقة.";
 }else if(g.e>=65&&g.w>=55&&g.a>=55){
  title="المعجزة الاقتصادية";
  desc="اقتصاد ينمو والناس تعمل، لكن الديمقراطية معلقة والأقليات تنتظر دستوراً يحميها. نموذج «الصين العربية»: كفاءة من فوق وحقوق مؤجلة.";
 }else if(g.a>=65&&g.s<40){
  title="الدولة الحديدية";
  desc="أمن كامل وشرعية خجولة: شوارع آمنة لأن فيها كاميرات أكثر منها صناديق اقتراع. مستقر اليوم، موقوت بالغد.";
 }else if(g.d>=70&&g.w<45){
  title="شرعية بلا شريك داخلي";
  desc="واشنطن وبرلمان الخليج معك، والقرى والأحياء تسأل: ومن نحن في دستوركم؟ دولة معترف بها من الخارج ومطلقة من نصف شعبها.";
 }else if(avg>=55){
  title="الاستقرار المشروط";
  desc="سوريا 2027: لا حرب ولا سلام كامل، لا انهيار ولا نهضة. دولة تمشي على عكازين — خارجي وداخلي — وتربح الوقت. وهذا وحله مكسب.";
 }else{
  title="دولة نصف مكتملة";
  desc="بقيت الدولة واقفة على قدم واحدة: مكاسب دبلوماسية مقابل ثغرات داخلية (أو العكس). المرحلة الانتقالية لم تبدأ ولم تنتهِ — بقيت «مرحلة».";
 }
 const gavg=g.w+g.a+g.s+g.d+g.e;
 document.getElementById("app").innerHTML=
 '<div class="card center"><div class="badge">النهاية — ديسمبر 2027</div><div class="big">'+title+'</div>'+
 '<p style="text-align:right">'+desc+'</p>'+
 '<p style="color:var(--dim);text-align:right">المعدل العام: '+avg+'/100</p>'+gauges()+
 '<div class="reality"><b>للمقارنة مع الواقع:</b><br>'+realScore+'</div>'+
 '<div class="grid2"><div class="card" style="background:var(--panel2)"><b>سجل قراراتك</b><div class="log">'+state.log.map(l=>'<div>'+l+'</div>').join('')+'</div></div>'+
 '<div class="card" style="background:var(--panel2)"><b>نصائح الجولة القادمة</b><ul>'+
 '<li>انظر إلى أدنى مؤشر — فهو ثغرة الجولة القادمة.</li>'+
 '<li>الأمن بلا عدالة يستقر ثم ينفجر؛ والعدالة بلا أمن تتحول إلى انتقام.</li>'+
 '<li>الخارج يموّل ما لا تستطيع الداخل تمويله — لكنه يفرض شروطه عليه.</li></ul>'+
 '<button class="btn" onclick="play()">جرّب من جديد</button></div></div></div>';
}

document.addEventListener("keydown",e=>{
 if(["1","2","3"].includes(e.key)&&state&&state.pending){const i=+e.key-1;if(i<state.pending.opts.length)choose(i);}
 if(e.key==="Enter"&&state&&state.pending)next();
});
showStart();
</script>
</body>
</html>
