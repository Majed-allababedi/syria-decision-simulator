<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>محاكي قرار سوريا — من التحرير إلى 2027</title>
<meta name="description" content="لعبة محاكاة قرارات مبنية على وقائع موثقة: من سقوط نظام الأسد في 8 ديسمبر 2024 حتى ديسمبر 2027. تعمل دون إنترنت.">
<style>
/* ==========================================================================
   محاكي قرار سوريا — التنسيقات (ثيم داكن + عربي RTL)
   ========================================================================== */
:root{
  --bg:#070a0f; --bg2:#0c1118; --panel:#111823; --panel2:#16202c; --panel3:#1b2634;
  --line:#243244; --line2:#2f4055;
  --txt:#e9eff7; --dim:#8fa1b6; --dim2:#63768c;
  --gold:#e7bf5c; --gold2:#c99b2e;
  --green:#46c97a; --red:#e8615f; --blue:#4ea6e8; --purple:#a98ae8;
  --orange:#f0904f; --teal:#3fc9c0;
  --r-leg:#e7bf5c; --r-coh:#4ea6e8; --r-sec:#46c97a; --r-eco:#f0904f; --r-srv:#3fc9c0;
  --r-mil:#a98ae8; --r-sov:#7fc96b; --r-dip:#e07ba6; --r-dem:#8fb2e8;
  --r-press:#e8615f; --r-frag:#ff9a6b; --r-shr:#c9952f;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --mono:"IBM Plex Mono","Courier New",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:
    radial-gradient(1200px 600px at 85% -10%, #14243a33 0%, transparent 60%),
    radial-gradient(900px 500px at 10% 0%, #e7bf5c10 0%, transparent 55%),
    var(--bg);
  color:var(--txt);
  font-family:"Segoe UI","Noto Naskh Arabic",Tahoma,Arial,sans-serif;
  line-height:1.75; font-size:15.5px;
}
a{color:var(--gold)}
.hidden{display:none !important}
/* محور الهوية: محايد — لون خاص ولا يُحسَب ربحاً أو خسارة */
.g.axis{border-color:#3d4d63;background:linear-gradient(180deg,#182231cc,#121b26cc)}
.g.axis .gv{color:var(--r-shr)}
.gd.neu{color:var(--dim2)}
.axisnote{margin-top:8px;padding:8px 10px;border:1px dashed #3d4d63;border-radius:10px;background:#121b26aa;color:var(--dim);font-size:12.5px}

.wrap{max-width:1240px;margin:0 auto;padding:18px 16px 80px}

/* ---------- شريط علوي ---------- */
.top{
  position:sticky; top:0; z-index:40;
  background:linear-gradient(180deg,#0a0f16 0%, #0a0f16ee 78%, transparent 100%);
  backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line); padding:10px 0 14px; margin-bottom:14px;
}
.topin{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:9px;background:linear-gradient(140deg,#1b2634,#0d141d);
  border:1px solid var(--line2);display:grid;place-items:center;font-size:20px}
.brand h1{font-size:1.05rem;color:var(--gold);font-weight:700;letter-spacing:.2px}
.brand small{display:block;color:var(--dim2);font-size:.75rem;line-height:1.4}
.monthbox{display:flex;align-items:center;gap:12px}
.monthbox .mt{font-size:1.15rem;font-weight:700}
.monthbox .mn{color:var(--dim2);font-size:.8rem;font-family:var(--mono)}
.topbtns{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- أزرار ---------- */
.btn{
  background:linear-gradient(180deg,var(--gold),var(--gold2)); color:#1a1408; font-weight:800;
  border:none; border-radius:10px; padding:10px 20px; font-size:.95rem; cursor:pointer;
  font-family:inherit; box-shadow:0 6px 18px rgba(231,191,92,.18); transition:.15s;
}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--panel2);color:var(--txt);border:1px solid var(--line2);box-shadow:none;font-weight:600}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold)}
.btn.sm{padding:6px 12px;font-size:.8rem;border-radius:8px}
.btn.danger{background:var(--panel2);color:var(--red);border:1px solid #3b2330}

/* ---------- التخطيط ---------- */
.grid{display:grid;grid-template-columns:1fr 372px;gap:18px;align-items:start}
@media(max-width:1000px){.grid{grid-template-columns:1fr}}
.side{position:sticky;top:96px}
@media(max-width:1000px){.side{position:static}}

.card{background:linear-gradient(180deg,var(--panel),#0e1520); border:1px solid var(--line);
  border-radius:16px; padding:18px; box-shadow:var(--shadow); margin-bottom:14px}
.card.tight{padding:14px}
.card h2{font-size:1.15rem;color:var(--gold);margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3{font-size:1rem;margin:12px 0 6px;color:#cdd9e6}
.sub{color:var(--dim);font-size:.9rem}
.tiny{font-size:.78rem;color:var(--dim2)}

/* ---------- رقائق ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel3);border:1px solid var(--line2);
  color:var(--dim);border-radius:20px;padding:3px 12px;font-size:.78rem}
.chip.risk-low{color:var(--green);border-color:#1e3b2b}
.chip.risk-med{color:var(--gold);border-color:#3d3418}
.chip.risk-high{color:var(--red);border-color:#40222a}
.chip.cat{color:var(--teal);border-color:#1d3a3a}
.chip.shock{color:var(--orange);border-color:#402b1c}

/* ---------- المؤشرات ---------- */
.gauges{display:grid;grid-template-columns:1fr 1fr;gap:9px}
@media(max-width:1000px){.gauges{grid-template-columns:1fr 1fr}}
.g{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:9px 11px;cursor:help}
.g .gl{display:flex;justify-content:space-between;align-items:baseline;font-size:.79rem;color:var(--dim);gap:6px}
.g .gv{font-family:var(--mono);font-size:.92rem;font-weight:700;color:var(--txt)}
.g .gd{font-family:var(--mono);font-size:.72rem;font-weight:700}
.g .gd.up{color:var(--green)} .g .gd.dn{color:var(--red)}
.gbar{height:7px;background:#080c12;border-radius:5px;margin-top:7px;overflow:hidden;position:relative}
.gbar i{display:block;height:100%;border-radius:5px;transition:width .55s cubic-bezier(.3,.8,.4,1)}
.gbar .zero{position:absolute;top:0;bottom:0;left:50%;width:1px;background:#ffffff14}
.g.neg .gl{color:#b98b8f}
.g.flash{animation:flash 1.1s ease}
@keyframes flash{0%{box-shadow:0 0 0 0 #e7bf5c55}60%{box-shadow:0 0 0 6px #e7bf5c00}100%{box-shadow:none}}

.resrow{display:flex;gap:10px;margin-top:10px}
.res{flex:1;background:linear-gradient(180deg,#16202c,#121a24);border:1px solid var(--line);
  border-radius:11px;padding:9px 11px;text-align:center}
.res b{display:block;font-family:var(--mono);font-size:1.2rem}
.res span{font-size:.74rem;color:var(--dim)}
.res.warn b{color:var(--red)}

/* ---------- أقسام جانبية ---------- */
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab{background:var(--panel2);border:1px solid var(--line);color:var(--dim);border-radius:9px;
  padding:6px 13px;font-size:.82rem;cursor:pointer;font-family:inherit}
.tab.on{background:var(--panel3);color:var(--gold);border-color:var(--line2)}
.rows{display:grid;gap:7px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.84rem}
.row .rn{color:var(--dim)}
.mini{width:110px;height:6px;background:#080c12;border-radius:4px;overflow:hidden;position:relative}
.mini i{display:block;height:100%;border-radius:4px}
.mini.split i{background:var(--blue)} .mini.thr i{background:var(--red)} .mini.pop i{background:var(--teal)}
.val{font-family:var(--mono);font-size:.78rem;min-width:26px;text-align:left}
.note{background:var(--panel2);border-right:3px solid var(--gold);border-radius:0 9px 9px 0;
  padding:8px 12px;font-size:.83rem;color:#c9d6e3;margin-bottom:8px}
.note.warnc{border-right-color:var(--red)} .note.goodc{border-right-color:var(--green)}
.note.infoc{border-right-color:var(--blue)}

/* ---------- الحدث ---------- */
.eventhead{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.brief{color:#d5e0ec;font-size:1.02rem}
.facts{display:grid;gap:6px;margin:12px 0;padding:11px 13px;background:#0c1219;border:1px solid var(--line);border-radius:11px}
.facts li{list-style:none;font-size:.85rem;color:var(--dim);padding-right:16px;position:relative}
.facts li:before{content:"◆";position:absolute;right:0;color:var(--gold2);font-size:.7rem;top:3px}
.facts b{color:#dbe6f1}

/* ---------- الخيارات ---------- */
.opts{display:grid;gap:11px;margin-top:14px}
.opt{display:block;width:100%;text-align:right;background:linear-gradient(180deg,var(--panel2),#121a24);
  border:1px solid var(--line2);color:var(--txt);border-radius:13px;padding:14px 16px;cursor:pointer;
  font-family:inherit;font-size:1rem;transition:.16s;position:relative}
.opt:hover{border-color:var(--gold);transform:translateY(-1px);background:linear-gradient(180deg,#1c2735,#151e29)}
.opt .key{position:absolute;left:12px;top:12px;background:#0b1119;border:1px solid var(--line2);
  color:var(--dim);border-radius:6px;padding:1px 8px;font-family:var(--mono);font-size:.78rem}
.opt b{color:var(--gold);display:block;margin-bottom:4px;font-size:1.02rem;padding-left:44px}
.opt small{color:var(--dim);font-size:.85rem;display:block}
.optmeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.pill{font-size:.75rem;padding:2px 10px;border-radius:9px;background:#0b1119;border:1px solid var(--line);color:var(--dim);font-family:var(--mono)}
.pill.p-hi{color:var(--green);border-color:#1e3b2b}
.pill.p-md{color:var(--gold);border-color:#3d3418}
.pill.p-lo{color:var(--red);border-color:#40222a}
.pill.cost{color:var(--orange);border-color:#402b1c}
.pill.lock{color:var(--dim2)}

/* ---------- النتيجة ---------- */
.outcome{border:1px solid var(--line2);border-radius:13px;padding:14px 16px;margin:6px 0 12px;background:var(--panel2);
  animation:fadein .35s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.outcome.t-ok{border-color:#204029;background:linear-gradient(180deg,#12241a,#0f1a15)}
.outcome.t-mid{border-color:#3d3418;background:linear-gradient(180deg,#221e10,#181610)}
.outcome.t-bad{border-color:#42212a;background:linear-gradient(180deg,#251319,#1a0f13)}
.outcome .ot{font-weight:800;margin-bottom:6px;font-size:1.02rem}
.t-ok .ot{color:var(--green)} .t-mid .ot{color:var(--gold)} .t-bad .ot{color:var(--red)}
.effs{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.eff{font-size:.78rem;padding:2px 9px;border-radius:9px;font-family:var(--mono)}
.eff.up{background:#12331f;color:#7ce79c}.eff.dn{background:#3a1a1a;color:#f7a0a0}
.eff.nu{background:#1b2634;color:var(--dim)}
.eff.ax{background:#2b2416;color:#e5c47a;border:1px dashed #6b5a2e}
.reality{border:1px dashed #2d4a35;background:#0e1a13;border-radius:12px;padding:12px 14px;margin-top:12px;font-size:.88rem}
.reality b{color:var(--green)}
.reality .rt{font-size:.78rem;color:#7ec896;letter-spacing:.4px;margin-bottom:5px;font-weight:700}
.nextrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}

/* ---------- منحنى ---------- */
canvas{width:100%;height:210px;display:block;background:#0a0f16;border:1px solid var(--line);border-radius:12px}
.legend{display:flex;flex-wrap:wrap;gap:9px;margin-top:9px}
.legend span{font-size:.74rem;color:var(--dim);display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:3px;border-radius:2px;display:block}

/* ---------- السجل ---------- */
.log{display:grid;gap:9px;max-height:420px;overflow:auto;padding-left:4px}
.li{border:1px solid var(--line);border-radius:11px;padding:9px 12px;background:var(--panel2);font-size:.85rem}
.li .lh{display:flex;justify-content:space-between;gap:8px;font-size:.75rem;color:var(--dim2);font-family:var(--mono)}
.li .lt{color:#cfdbe8;margin:3px 0}
.li .lo{color:var(--gold);font-size:.86rem}
.li .lx{color:var(--dim);font-size:.8rem}
.tiertag{font-size:.7rem;padding:1px 8px;border-radius:8px}
.tiertag.ok{background:#12331f;color:#7ce79c}.tiertag.mid{background:#33290f;color:#e7cf7c}
.tiertag.bad{background:#3a1a1a;color:#f7a0a0}

/* ---------- البداية ---------- */
.hero{background:linear-gradient(135deg,#141d29,#0c1218 60%);border:1px solid var(--line2);border-radius:18px;
  padding:26px;margin-bottom:18px;box-shadow:var(--shadow)}
.hero h1{font-size:1.85rem;color:var(--gold);line-height:1.4}
.hero .tag{color:var(--dim);margin-top:6px;font-size:.95rem}
.flagline{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.stat3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:14px}
.mini-card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:.84rem}
.mini-card b{color:var(--gold);display:block;margin-bottom:3px}
.pickers{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-top:12px}
.pick{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:13px}
.pick h4{font-size:.95rem;color:#dbe6f2;margin-bottom:8px}
.pick label{display:flex;gap:8px;align-items:flex-start;font-size:.85rem;padding:6px 0;cursor:pointer;color:var(--dim)}
.pick input{margin-top:4px;accent-color:var(--gold)}
.pick label:hover{color:var(--txt)}
.pick .pd{font-size:.76rem;color:var(--dim2);display:block}

/* ---------- النهاية ---------- */
.finalhead{ text-align:center;padding:22px 16px}
.finalhead .big{font-size:2.1rem;color:var(--gold);margin:8px 0 10px;line-height:1.35}
.scorebox{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.scorebox div{background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:12px 20px;text-align:center}
.scorebox b{display:block;font-size:1.7rem;font-family:var(--mono)}
.scorebox span{font-size:.76rem;color:var(--dim)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:860px){.two{grid-template-columns:1fr}}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;border-bottom:1px dashed var(--line);padding:5px 0}
.kv span:first-child{color:var(--dim)}
.hl{background:#1a2432;border-radius:4px;padding:0 5px;color:var(--gold)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#233043;border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

</style>
</head>
<body>
<div id="app"></div>
<noscript><p style="padding:30px">هذه اللعبة تحتاج JavaScript.</p></noscript>
<script>
/* =========================================================================
   محاكي قرار سوريا — المحرك (v2)
   من 8 ديسمبر 2024 (سقوط النظام) حتى ديسمبر 2027
   المحرك مستقل عن البيانات: كل الأحداث في src/data/*.json
   ========================================================================= */
"use strict";
var SY = (function () {

  /* ---------- 1) قاموس المؤشرات ---------- */
  // مؤشرات إيجابية (0-100، الأعلى أفضل)
  var STATS = {
    leg:  { n: "شرعية الحكم",        s: "ثقة الشارع والمؤسسات بقرار القيادة", ic: "🏛️" },
    coh:  { n: "التماسك الوطني",     s: "وحدة المكونات ومنع الانفلات الأهلي",   ic: "🤝" },
    sec:  { n: "الأمن واحتكار السلاح", s: "أمان الشارع وسيطرة الدولة على السلاح", ic: "🚓" },
    eco:  { n: "الاقتصاد",           s: "نمو، تشغيل، قدرات شرائية، استثمار",    ic: "📈" },
    srv:  { n: "الخدمات والبنية",    s: "كهرباء، ماء، صحة، تعليم، نقل",        ic: "💡" },
    mil:  { n: "الجاهزية العسكرية",  s: "جيش منضبط ودفاع جوي ومسيرات",         ic: "🛡️" },
    sov:  { n: "السيادة",            s: "حضور الدولة على كامل الأرض والقرار",    ic: "🗺️" },
    dip:  { n: "الرصيد الدبلوماسي",   s: "واشنطن، الخليج، أوروبا، الأمم المتحدة", ic: "🌐" },
    dem:  { n: "الشرعية المؤسساتية", s: "دستور، برلمان مفوَّض، قضاء مستقل",     ic: "⚖️" }
  };
  // مؤشرات سالبة (0-100، الأعلى أسوأ)
  var NEG = {
    press: { n: "الضغط الإسرائيلي", s: "غارات وتوغل وتهديد وقضم أرض", ic: "🔥" },
    frag:  { n: "الاحتقان والانفلات", s: "قابلية الانفجار الأهلي والأمني", ic: "💥" }
  };
  var RES = {
    cash: { n: "الخزينة", u: "مليار $", max: 60, s: "ما تملكه الدولة فعلياً للإنفاق" },
    cap:  { n: "الرصيد السياسي", u: "/100", max: 100, s: "ما تستطيع إنفاقه على قرارات مؤلمة" }
  };
  // محور هوية: محايد — لا يُكسِب ولا يُخسِر في حد ذاته، بل يقرّر مَن يرضى ومَن يغضب.
  // لا يدخل في متوسط النتيجة، لكنه يغيّر ديناميكا المكونات والتمويل وسخط المقاتلين.
  var AXIS = {
    shr: {
      n: "مرجعية الشريعة في التشريع", ic: "🕌",
      s: "موضع الدين من التشريع والقضاء — وعد القيادة لمقاتليها قبل النصر وبعده",
      lo: "دولة مدنية بقانون", hi: "تحكيم كامل للشريعة"
    }
  };
  var REL = {
    us:   "واشنطن", eu: "أوروبا", gulf: "الخليج", tr: "أنقرة",
    ru:   "موسكو",  il: "تل أبيب", ir: "طهران",   arab: "العرب والأمم"
  };
  var POP = {
    sunn: "القاعدة السنية", alaw: "العلويون", druze: "الدروز",
    kurd: "الكرد", christ: "المسيحيون", trib: "العشائر"
  };
  var THR = { isis: "داعش", rem: "فلول النظام", war: "فصائل خارج السيطرة" };

  var START_MONTH = { y: 2024, m: 12 };
  var MONTHS_TOTAL = 37; // ديسمبر 2024 ... ديسمبر 2027

  var MONTHS_AR = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];

  /* ---------- 2) أدوات ---------- */
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function rngFactory(seed) {
    var s = seed >>> 0;
    return function () {
      s += 0x6D2B79F5; s >>>= 0;
      var t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function monthLabel(i) {
    var idx = START_MONTH.m - 1 + i;
    var y = START_MONTH.y + Math.floor(idx / 12);
    return MONTHS_AR[idx % 12] + " " + y;
  }

  /* ---------- 3) الحالة الابتدائية ----------
     القيم مأخوذة من وقائع ديسمبر 2024: جيش مُدمَّر (70-80% من السلاح
     الاستراتيجي ضُرب)، سيادة ناقصة (احتلال المنطقة العازلة)، سيولة صفرا،
     شرعية نصر عالية جداً، تفاؤل خارجي حذر. */
  function initialState(seed) {
    return {
      seed: seed,
      month: 0,
      diff: "واقعي",
      difficulty: 1.0,
      st: {
        leg: 74, coh: 46, sec: 34, eco: 22, srv: 18, mil: 20, sov: 30, dip: 40, dem: 12,
        press: 78, frag: 62,
        shr: 48   // الوعد قائم (الفقه «مصدر رئيسي» في الإعلان الدستوري) والتنفيذ مؤجَّل
      },
      res: { cash: 0.6, cap: 70 },
      rel: { us: 22, eu: 30, gulf: 55, tr: 72, ru: 38, il: 8, ir: 10, arab: 45 },
      pop: { sunn: 72, alaw: 22, druze: 30, kurd: 30, christ: 35, trib: 48 },
      thr: { isis: 55, rem: 62, war: 66 },
      cabinet: [],
      doctrine: null,
      flags: {},
      shrHigh: 48,   // أعلى مستوى بلغه محور الشريعة (لسُلّم التراجع)
      used: {},
      queue: [],        // أحداث مجدولة: {id, at}
      delay: [],        // آثار مؤجلة: {at, eff, txt, from}
      log: [],          // سجل القرارات
      line: [],         // لقطات المؤشرات لرسم المنحنى
      seen: [],
      notes: {},        // ملاحظات الحالة لكل شهر
      over: null,
      rng: rngFactory(seed || 1)
    };
  }

  /* ---------- 4) تطبيق الآثار ---------- */
  function applyEff(S, eff) {
    if (!eff) return;
    for (var k in eff) {
      var v = eff[k];
      if (k in S.st) S.st[k] = clamp(S.st[k] + v, 0, 100);
      else if (k in S.res) {
        if (k === "cash") S.res.cash = Math.max(-5, +(S.res.cash + v).toFixed(2));
        else S.res.cap = clamp(S.res.cap + v, 0, 100);
      }
      else if (k.indexOf("r_") === 0) { var a = k.slice(2); if (a in S.rel) S.rel[a] = clamp(S.rel[a] + v, 0, 100); }
      else if (k.indexOf("p_") === 0) { var b = k.slice(2); if (b in S.pop) S.pop[b] = clamp(S.pop[b] + v, 0, 100); }
      else if (k.indexOf("t_") === 0) { var c = k.slice(2); if (c in S.thr) S.thr[c] = clamp(S.thr[c] + v, 0, 100); }
    }
  }
  function addFlags(S, list) { (list || []).forEach(function (f) { S.flags[f] = (S.flags[f] || 0) + 1; }); }
  function has(S, f) { return !!S.flags[f]; }

  /* ---------- 5) شروط ظهور الأحداث ---------- */
  function condOK(S, w) {
    if (!w) return true;
    var i;
    if (w.flagAll) for (i = 0; i < w.flagAll.length; i++) if (!has(S, w.flagAll[i])) return false;
    if (w.flagAny && w.flagAny.length) {
      var any = false;
      for (i = 0; i < w.flagAny.length; i++) if (has(S, w.flagAny[i])) any = true;
      if (!any) return false;
    }
    if (w.flagNone) for (i = 0; i < w.flagNone.length; i++) if (has(S, w.flagNone[i])) return false;
    if (w.min) for (var k in w.min) if (getVal(S, k) < w.min[k]) return false;
    if (w.max) for (var k2 in w.max) if (getVal(S, k2) > w.max[k2]) return false;
    if (w.monthMin && S.month < w.monthMin) return false;
    if (w.monthMax && S.month > w.monthMax) return false;
    return true;
  }
  function getVal(S, k) {
    if (k in S.st) return S.st[k];
    if (k === "cash") return S.res.cash;
    if (k === "cap") return S.res.cap;
    if (k.indexOf("r_") === 0) return S.rel[k.slice(2)] || 0;
    if (k.indexOf("p_") === 0) return S.pop[k.slice(2)] || 0;
    if (k.indexOf("t_") === 0) return S.thr[k.slice(2)] || 0;
    return 0;
  }

  /* ---------- 6) احتمال نجاح الخيار ---------- */
  function chance(S, opt) {
    if (!opt.prob) return null;
    var base = opt.prob.base;
    var mods = opt.prob.mods || {};
    var adj = 0;
    for (var k in mods) adj += getVal(S, k) * mods[k];
    var cabinetMod = 0;
    (S.cabinet || []).forEach(function (c) { if (c.cat && opt.cat && c.cat === opt.cat) cabinetMod += (c.v || 0); });
    if (S.doctrine && opt.cat && S.doctrine.bonusCat === opt.cat) cabinetMod += 6;
    var p = base + adj + cabinetMod;
    // عقوبات الحالة الحرجة: إفلاس، احتقان حرج، نفاد رصيد سياسي
    if (S.res.cash < -2) p -= 4;
    if (S.st.frag > 75) p -= Math.min(6, (S.st.frag - 75) * 0.24);
    if (S.res.cap < 15) p -= 4;
    // الصعوبة غير متماثلة: السهل يرفع كل الاحتمالات، القاسي يخفضها (بلا قلب للاتجاه)
    if (S.diff === "easy") p += (100 - p) * 0.14;
    else if (S.diff === "hard") p -= p * 0.16;
    return clamp(Math.round(p), 14, 94);
  }

  /* ---------- 7) اختيار حدث الشهر ---------- */
  function pickEvent(S, data) {
    // (أ) أحداث مجدولة مستحقة
    var due = [], keep = [];
    S.queue.forEach(function (q) { if (q.at <= S.month) due.push(q.id); else keep.push(q); });
    S.queue = keep;
    var ev = null;
    for (var i = 0; i < due.length && !ev; i++) {
      var c = data.byId[due[i]];
      if (c && !S.used[c.id] && condOK(S, c.when)) ev = c;
    }
    // (ب) أحداث الشهر المؤهلة: أولوية + ضغط استحقاق (المهلة ترفع الوزن)
    if (!ev) {
      var cands = [];
      data.events.forEach(function (e) {
        if (S.used[e.id]) return;
        if (e.month > S.month) return;
        if (e.ttl && S.month > e.month + e.ttl) return;                // انتهت صلاحية
        if (e.shock) return;
        if (condOK(S, e.when)) cands.push(e);
      });
      cands.forEach(function (e) { e._urg = urgency(S, e) + S.rng() * 4; });
      cands.sort(function (a, b) {
        var d = (b._urg * 6 + (b.pri || 0) * 1.5) - (a._urg * 6 + (a.pri || 0) * 1.5);
        if (d) return d;
        return (a.month - b.month);
      });
      ev = cands[0] || null;
    }
    // (ج) صدمة عشوائية — مقيّدة بنافذتها الزمنية هي أيضاً
    if (!ev || S.rng() < shockChance(S)) {
      var shocks = data.events.filter(function (e) {
        if (!e.shock || S.used[e.id]) return false;
        var win = Math.max(1, e.ttl || 1);
        if (S.month < e.month - win || S.month > e.month + win) return false;
        return condOK(S, e.when);
      });
      if (shocks.length) ev = shocks[Math.floor(S.rng() * shocks.length)];
    }
    return ev;
  }
  // ضغط الاستحقاق: كلما اقترب موعد انتهاء صلاحية الحدث ارتفع وزنه ليصل 12 نقطة.
  function urgency(S, e) {
    var ttl = e.ttl || 1;
    var left = (e.month + ttl) - S.month;              // أشهر متبقية قبل السقوط
    var p = clamp((ttl - left + 1) / (ttl + 1), 0, 1); // 0 ← جديد … 1 ← آخر شهر
    return 12 * p * p;
  }
  function shockChance(S) {
    var f = 0.22 + (S.thr.isis - 40) * 0.004 + (S.thr.rem - 40) * 0.003 + (S.st.frag - 50) * 0.004 - (S.st.sec - 50) * 0.003;
    return clamp(f, 0.10, 0.50);
  }

  /* ---------- 8) انجراف شهري تلقائي (ديناميكا النظام) ---------- */
  function drift(S) {
    var out = {};
    var d = function (k, v) { if (v) out[k] = (out[k] || 0) + v; };
    var st = S.st;
    // الاحتلال يستنزف السيادة والاقتصاد والشرعية
    if (st.press > 70) { d("sov", -(st.press - 70) * 0.06); d("eco", -0.8); d("leg", -0.6); d("frag", +0.5); }
    else if (st.press < 45) { d("eco", +0.6); d("sov", +0.4); }
    // الاقتصاد: نمو إن كانت السيادة والضغط مقبولين + رصيد دبلوماسي
    var growth = 0.45 + (st.dip - 40) * 0.02 + (st.sec - 45) * 0.015 - (st.frag - 50) * 0.018 - Math.max(0, st.press - 60) * 0.012;
    d("eco", growth);
    // الخدمات تتآكل بلا إنفاق
    d("srv", -0.35 + (S.res.cash > 6 ? 0.3 : 0));
    // الرصيد السياسي يتآكل مع الإخفاق الاقتصادي
    d("cap", (st.eco > 55 ? 0.6 : (st.eco < 25 ? -0.7 : 0.05)));
    // التهديدات
    d("t_isis", (S.thr.war > 50 ? 0.8 : 0) + (st.sec < 45 ? 0.7 : -0.5) + (S.rel.us > 60 ? -0.4 : 0));
    d("t_rem", (st.sec < 40 ? 0.6 : -0.3) + (getVal(S, "p_alaw") > 55 ? -0.5 : 0));
    d("t_war", (st.sec < 40 ? 0.45 : -0.50) + (has(S, "factions_kept") ? 0.35 : 0) - (st.mil > 45 ? 0.25 : 0));
    // الضغط الإسرائيلي يرتفع بالعجز الدبلوماسي وينخفض بالمسار السياسي والقوة العسكرية
    d("press", (st.dip > 60 ? -0.30 : (st.dip < 40 ? 0.25 : 0)) + (st.mil > 55 ? -0.15 : 0) + (st.sov < 25 ? 0.20 : 0));
    // تراكم قدرات الاحتكار الأمني مع الزمن (إن لم تكن في حرب مفتوحة)
    d("sec", (S.thr.war > 70 ? -0.30 : 0.30) + (st.mil > 45 ? 0.20 : -0.10) + (S.st.frag > 80 ? -0.20 : 0));
    // الاحتقان: مزيج ثقة المكونات + اقتصاد + تهديدات
    var compAvg = (S.pop.sunn + S.pop.alaw + S.pop.druze + S.pop.kurd + S.pop.christ + S.pop.trib) / 6;
    d("frag", (50 - compAvg) * 0.008 + (40 - st.eco) * 0.008 + (S.thr.isis - 45) * 0.008 + (S.thr.war - 45) * 0.007 - (st.srv - 45) * 0.014 - (st.coh - 50) * 0.008);
    // الشرعية تنزح مع الخدمات والاقتصاد
    d("leg", (st.srv - 45) * 0.012 + (st.eco - 45) * 0.012 - (st.frag - 50) * 0.01);
    // هجرة الكفاءات ورساميل عند ارتفاع الاحتقان
    d("cash", st.frag > 65 ? -0.10 : (st.eco > 45 ? 0.20 : 0.08));
    // ===== محور تحكيم الشريعة: سوق ضغط ذو اتجاهين =====
    var shrPress = (52 - st.shr) * 0.012;   // انجذاب طبيعي إلى «صيغة الوسط» الدستورية
    if (has(S, "fighters_pledge")) shrPress += 0.35;          // بيعة/وعد للمقاتلين قائم
    if (has(S, "sharia_council_state")) shrPress += 0.25;     // مأسسة المرجعية داخل الدولة
    if (has(S, "salafist_split")) shrPress += 0.30;           // منافسة السلفيين على الشارع الديني
    if (has(S, "minority_pact")) shrPress -= 0.30;            // عقد مع المكونات غير السنية
    if (has(S, "awqaf_purged")) shrPress -= 0.20;             // ضبط المؤسسة الدينية بيدها
    if (st.shr > 70) shrPress -= 0.25;                        // كلفة خارجية/مؤسساتية تدفع للتراجع
    if (st.shr < 32) shrPress += 0.22;                        // ضغط القاعدة يعيد رفع السقف
    d("shr", shrPress);
    // كلفة الانزياح: النزول يُغضب المقاتلين، والصعود يُقلق المكونات والمانحين
    if (st.shr < 32) { d("t_war", 0.22); d("p_sunn", -0.12); d("frag", 0.10); }
    if (st.shr > 72) { d("p_alaw", -0.22); d("p_christ", -0.18); d("p_druze", -0.12); d("r_eu", -0.10); }
    if (st.shr >= 45 && st.shr <= 62 && st.dem > 45) { d("coh", 0.10); d("r_gulf", 0.06); }
    // ===== عدوى المكونات: إهمال مكوّن أقلّي يُعاقَب شهرياً =====
    var bleed = 0;
    ["alaw", "druze", "kurd", "christ"].forEach(function (c) {
      var v = S.pop[c];
      if (v < 20) bleed += (20 - v) / 20;               // 0 … 1 لكل مكوّن خارج العقد
    });
    if (bleed) { d("coh", -0.6 * bleed); d("frag", +0.5 * bleed); d("t_war", +0.4 * bleed); }
    return out;
  }
  // سُلّم الشريعة: عتبات مقفلة — التراجع بعد عبور عتبة يكلف انشقاقاً
  var LADDER = [{ at: 35, cap: -6, frag: 5 }, { at: 60, cap: -12, frag: 10 }, { at: 80, cap: -18, frag: 16 }];
  function ladderCost(S, prevShr) {
    var back = 0;
    LADDER.forEach(function (t, i) { if (S.shrHigh >= t.at && S.st.shr < t.at - 8) back = Math.max(back, i + 1); });
    if (!back) return null;
    var key = "ladder_back" + back;
    if (S.flags[key]) return null;
    S.flags[key] = 1;
    var t = LADDER[back - 1];
    return { cap: t.cap, frag: t.frag, t_war: 4, txt: "التراجع عن استحقاق تشريعي سبق إقراره: المقاتلون يعدّونه نكثاً، والمتشددون يعدّونه ضعفاً." };
  }

  /* ---------- 9) حالات الانهيار ---------- */
  function collapse(S) {
    var st = S.st;
    if (S.month < 2) return null;
    if (st.sec < 10 && st.frag > 80) return { id: "X_collapse", t: "انهار احتكار السلاح", d: "تفككت الأجهزة وباتت ميليشيات وقطاع طرق يديرون المحافظات. الدولة اسم على خريطة." };
    if (st.leg < 12) return { id: "X_legitimacy", t: "انفجر الشارع", d: "شرعية انهارت في الشارع بعد وعود لم تُنفَّذ؛ حراك شعبي يجبر القيادة على الرحيل أو المواجهة الدموية." };
    if (st.mil < 8 && st.press > 82) return { id: "X_deterrence", t: "سقوط الردع", d: "بلا جيش وبلا ضغط منخفض: الجنوب يُبتلع، ودمشق تتفاوض تحت النار على كل شيء." };
    if (S.res.cash < -3 && st.eco < 20) return { id: "X_bankrupt", t: "إفلاس الدولة", d: "رواتب معطلة، ليرة تنهار، مستشفيات تقفل. الانهيار القادم اجتماعي لا عسكري." };
    if (st.coh < 15 && (S.pop.alaw < 12 || S.pop.druze < 12 || S.pop.kurd < 12)) return { id: "X_balkan", t: "تفكك فعلي", d: "مكونات خرجت من العقد الوطني، وخطوط تماس داخلية دائمة: ثلاث سوريات لا دولة واحدة." };
    if (S.month > 6 && st.frag > 94 && st.sec < 28 && (S.thr.war > 72 || S.thr.isis > 76)) return { id: "X_chaos", t: "فوضى عامة", d: "اقتتال في ثلاث مناطق في شهر واحد، واغتيالات بالجملة، والجيش منشغل بنفسه." };
    if (st.shr > 74 && S.pop.alaw < 22 && st.coh < 38) return { id: "X_theo", t: "الهوية قبل العقد", d: "تشريعات سريعة بلا عقد وطني: مكونات حليفة انسحبت من الدولة، وحاضنة المقاتلين وحدها في الشارع." };
    if (st.shr < 26 && S.thr.war > 68 && st.leg < 48) return { id: "X_breach", t: "تمرد الحاضنة", d: "جيل المقاتلين الذين بيعوا على «كتاب الله» خرج على الدولة: خلايا، اعتصامات مسلحة، وخطباء يصفون القصر بالمرتدّ." };
    return null;
  }

  /* ---------- 10) تنفيذ القرار ---------- */
  function resolve(S, ev, opt) {
    var res = { txt: "", eff: {}, roll: null, tier: "ok" };
    var cost = opt.cost || {};
    // كلفة فورية — وإن نفد الرصيد السياسي يمر القرار «بمرسوم» بثمن أعلى
    var deficit = (cost.cap && S.res.cap + cost.cap < 0) ? -(S.res.cap + cost.cap) : 0;
    applyEff(S, cost);
    if (deficit > 0) applyEff(S, { frag: +(deficit * 0.7).toFixed(1), dem: -Math.round(deficit * 0.4), leg: -Math.round(deficit * 0.2) });

    var p = chance(S, opt);
    var tier = "ok";
    if (p !== null) {
      var r = S.rng() * 100;
      res.roll = { p: p, r: Math.round(r), hit: r < p };
      if (r < p) tier = "ok";
      else if (r < p + (100 - p) * 0.45) tier = "mid";
      else tier = "bad";
      res.tier = tier;
    }
    var o = (opt.out && opt.out[tier]) ? opt.out[tier] : null;
    var eff = o ? o.eff : opt.eff;
    res.txt = o ? o.txt : (opt.txt || "تم تنفيذ القرار.");
    res.eff = eff || {};
    res.decree = deficit;
    res.flags = (o && o.flags ? o.flags : []).concat(opt.flags || []);
    applyEff(S, eff);
    addFlags(S, res.flags);
    // آثار مؤجلة
    (opt.delay || []).forEach(function (dl) {
      S.delay.push({ at: S.month + (dl.in || 1), eff: dl.eff, txt: dl.txt, flags: dl.flags });
    });
    // أحداث مقفلة بموعد
    (opt.unlocks || []).forEach(function (id) {
      S.queue.push({ id: id, at: S.month + (opt.unlockIn || 1) });
    });
    S.log.push({
      month: monthLabel(S.month), dateIdx: S.month, cat: ev.cat, ev: ev.title,
      opt: opt.t, tier: p === null ? null : tier, p: p, eff: res.eff, txt: res.txt
    });
    return res;
  }

  /* ---------- 11) التقدم شهر ---------- */
  // حزم دعم/تمويل عالمية وصلت فعلاً في هذه الأشهر (مرة واحدة)
  var SUPPORT = { 4: 0.5, 11: 1.0, 12: 0.8, 14: 1.2, 16: 0.5, 22: 1.0, 26: 0.6, 30: 0.5 };
  function advance(S) {
    S.month++;
    var msgs = [];
    // آثار مؤجلة مستحقة
    var due = [], keep = [];
    S.delay.forEach(function (d) { if (d.at <= S.month) due.push(d); else keep.push(d); });
    S.delay = keep;
    due.forEach(function (d) { applyEff(S, d.eff); addFlags(S, d.flags); if (d.txt) msgs.push({ t: "أثر متأخر", x: d.txt }); });
    // دعم مانحين مستحق في هذا الشهر (مرونة مالية لا قرار سياسي)
    if (SUPPORT[S.month]) { S.res.cash = Math.round((S.res.cash + SUPPORT[S.month]) * 100) / 100; msgs.push({ t: "تمويل خارجي", x: "حزمة دعم/اتفاقيات تضيف " + SUPPORT[S.month] + " مليار $ للخزينة (مرتبطة بمسار رفع العقوبات)." }); }
    // انجراف
    var dr = drift(S);
    applyEff(S, dr);
    // سُلّم الشريعة: كلفة التراجع عن عتبة سبق عبورها
    var lb = ladderCost(S, S.shrHigh);
    if (lb) { applyEff(S, { cap: lb.cap, frag: lb.frag, t_war: lb.t_war }); msgs.push({ t: "نكث تشريعي", x: lb.txt }); }
    if (S.st.shr > S.shrHigh) S.shrHigh = S.st.shr;
    // لقطات للمنحنى
    S.line.push({
      m: S.month, leg: S.st.leg, coh: S.st.coh, eco: S.st.eco, mil: S.st.mil,
      sov: S.st.sov, dip: S.st.dip, sec: S.st.sec, dem: S.st.dem, srv: S.st.srv,
      press: S.st.press, frag: S.st.frag, shr: S.st.shr, cash: S.res.cash
    });
    return { drift: dr, msgs: msgs };
  }

  /* ---------- 12) التقييم والنهايات ---------- */
  function score(S) {
    var st = S.st;
    var w = { leg: 1.0, coh: 1.25, sec: 1.0, eco: 1.15, srv: 0.9, mil: 0.8, sov: 1.15, dip: 0.8, dem: 0.7 };
    var sum = 0, wsum = 0;
    for (var k in w) { sum += st[k] * w[k]; wsum += w[k]; }
    var avg = sum / wsum;
    var penalty = Math.max(0, st.press - 50) * 0.18 + Math.max(0, st.frag - 50) * 0.22;
    var compAvg = (S.pop.sunn + S.pop.alaw + S.pop.druze + S.pop.kurd + S.pop.christ + S.pop.trib) / 6;
    var final = clamp(avg - penalty + (compAvg - 45) * 0.08, 0, 100);
    return {
      avg: Math.round(avg), final: Math.round(final), penalty: Math.round(penalty),
      grade: final >= 82 ? "أ" : final >= 72 ? "ب" : final >= 62 ? "ج" : final >= 52 ? "د" : final >= 42 ? "هـ" : "و",
      compAvg: Math.round(compAvg)
    };
  }
  function specificity(w) {
    if (!w) return 0;
    var n = 0;
    ["flagAll", "flagAny", "flagNone"].forEach(function (k) { if (w[k]) n += w[k].length; });
    if (w.min) n += Object.keys(w.min).length;
    if (w.max) n += Object.keys(w.max).length;
    if (w.monthMin) n++; if (w.monthMax) n++;
    return n;
  }
  function ending(S, endings) {
    var sc = score(S), best = null, bestScore = -1e9;
    for (var i = 0; i < endings.length; i++) {
      var e = endings[i];
      if (!condOK(S, e.when)) continue;

rnal إلى عقد Internal."}, {"id": "T3_pledge_breach", "title": "الوعد الذي انقلب: حاضنة المقاتلين خرجت على الدولة", "desc": "لم تُحكم الشريعة ولم يُوفَ بالوعد: جيل المقاتلين الذين بيعوا على «كتاب الله» صار في الشارع ضد القصر، وخلايا رافضة تقتل في جرمانا والسويداء. الخسارة هنا ليست دينية بل سياسية — من يظن أن الوعد مؤبد يخطئ الحساب.", "when": {"flagAll": ["jihadi_revolt"], "min": {"t_war": 50}}}, {"id": "T1_reference_state", "title": "دولة المرجعية: الفقه فوق المشرّع", "desc": "هيئة مطابقة أو مادة دستورية جعلت المرجعية الدينية فوق التشريع: قاعدة اجتماعية راضية، وقضاء مُقيَّد، ومكوّنات غير سنية تشعر أن العقد لم يعد بينها وبين الدولة. النموذج المُطبَّق أقرب إلى تدرّج إدلب منه إلى نموذج الدولة الإسلامية — لكن كلفة الثقة دُفعت مقدّماً.", "when": {"flagAny": ["fiqh_code", "sharia_council_state"], "min": {"shr": 55, "leg": 45}, "max": {"frag": 62}}}, {"id": "N3_institutions", "when": {"min": {"dem": 70, "dip": 58}, "max": {"frag": 42}}, "title": "المؤسسات أولاً: برلمان يحاسب ومحكمة تقف", "desc": "لم تنتهِ كل الملفات، لكن قواعد اللعبة تغيّرت: انتخابات محلية جرت، وأحزاب سجّلت، ومجلس شعب يستجوب وزراء، وقضاء ينظر في ملفات فساد. هذه أضعف النهايات «إثارةً» وأقواها قابلية للبقاء: لأن الدولة لم تعد تعتمد على رجل واحد.<br><br><b>الثمن الذي دفعته:</b> بطء الحسم الأمني، وغضب أجنحة السلاح."}, {"id": "N4_services", "when": {"min": {"srv": 62, "eco": 60}, "max": {"frag": 40}}, "title": "دولة الكهرباء والماء: شرعية من المِصباح", "desc": "الكهرباء 12 ساعة، والمياه في البيوت، والمشفى يعمل، والبيت المهدوم أعيد بناؤه لصاحبه لا لمستثمر. هذه end حالة لا يُروى عنها في العواصم لكنها تُنتخب في القرى: الشارع يقارن ديسمبر 2027 بديسمبر 2024 ويقول «أقله عشنا». السيادة ما منقوصة؟ نعم، والعدالة ما اكتملت؟ نعم.<br><br><b>ما يحمي هذه النهاية:</b> جيل لم يعد يقارن بالسابق، بل بالحاضر."}, {"id": "N5_security_pax", "when": {"min": {"sec": 66, "mil": 52}, "max": {"coh": 52, "dem": 52}}, "title": "السلام الأمني: شارع آمن ومجتمع مقيد", "desc": "لا تفجيرات، لا حواجز متناحرة، لا ميليشيات متفلتة: الأمن نجح في مهمته. لكن الثمن واضح: قانون انتخابات ضعيف، وبرلمان تصديق، ومكوّنات تشتكي من «عدالة انتقائية»، وصحافة تحسب كلماتها. هذا نموذج مستقرّ لسنتين، خطر على خمس: لأن الانضباط بلا تفويض يتحوّل مع الوقت إلى عبء على صاحبه.<br><br><b>التاريخ يقول:</b> كل أمن بلا عقد ينفجر في أول أزمة اقتصادية."}, {"id": "N6_growth_unfair", "when": {"min": {"eco": 64}, "max": {"leg": 55, "srv": 55}}, "title": "الأبراج والصفّ الطويل: نمو لا يصل الجيب", "desc": "الأرقام جميلة: نمو، عقود، مطارات، غاز بحري، وسياحة عائدة. والشارع يقول شيئاً آخر: الراتب لا يشتري بيتاً، والكهرباء بالمولّد، والفقر حول 90%. هذا هو الاحتمال الأكثر واقعية لكل انتقال ما بعد حرب: اقتصاد يتعافى أسرع من العدالة.<br><br><b>كيف تنقلب هذه النهاية؟</b> بسعر رغيف، أو بفيديو لوزير في قصر."}, {"id": "N7_no_war_no_peace", "when": {"min": {"press": 48}, "max": {"press": 72, "sov": 34}}, "title": "الحدود المعلقة: لا حرب، ولا سلام، ولا اتفاق", "desc": "ثلاث سنوات من المفاوضات بلا توقيع: الجولان يُبتلع بالبطيء، والجنوب محكوم بفهم إسرائيلي لـ«الأمن»، والسويداء تحت ظله، والاقتصاد يدفع علاوة مخاطر دائمة. لا شيء انهار، ولا شيء استقرّ.<br><br><b>هذه أخطر النهايات الهادئة:</b> لأنها تُعلّم جيلياً أن التردد سياسة، وأن الأرض تُفقد بالتقسيط."}, {"id": "N8_statelets", "when": {"min": {"frag": 52}, "max": {"sov": 46}, "flagAny": ["sweidacrisis", "kurd_open", "coast_open", "warlord_badiya"]}, "title": "دولة واحدة… بأربعة أزمنة", "desc": "الخريطة واحدة في الإعلام، ومختلفة في الواقع: السويداء تدير نفسها بالحرس، والجزيرة تتفاوض مع دمشق لا تطيعها، والساحل يعيش ذاكرة مجزرة بلا محاسبة، والبادية ساحة مفاوضات مع السلاح. العلم واحد، والقانون أربعة.<br><br><b>الحلّ الوحيد المتبقي:</b> لامركزية حقيقية تُسمّى باسمها، قبل أن تسمّيها الأزمة تقسيماً."}, {"id": "N9_delayed_transition", "when": {"flagAll": ["indefinite_transition"], "min": {"frag": 40}}, "title": "الانتقال الذي صار نظاماً", "desc": "لم يُنهِ أحدٌ المرحلة الانتقالية: مجالس مُعيّنة، ومراسيم بدل قوانين، وجدول زمني يُمدَّد بلغة مهذبة. الحكم مستقرّ، والشكوى تتراكم: «إلى متى؟» صارت شعار كل تظاهرة. هذه نهاية تُربح السنة وتُفقد العقد.<br><br><b>ما الذي يُنقذها؟</b> انتخابات رئاسية وتشريعية بتنافس حقيقي في 2028 — أو دستور يصدر بإرادة واضحة."}, {"id": "N10_isis_cold_war", "when": {"min": {"t_isis": 45, "press": 45}, "max": {"sec": 55}}, "title": "الحرب التي لم تنتهِ: البادية تأكل الميزانية", "desc": "داعش لم تُهزم: خلايا تضرب أسبوعياً، والبادية خارج سيطرة فعلية، والسجون عبء، والتحالف يفرض إيقاعه. ومعها الجنوب مضغوط. النتيجة: دولة أمننة ميزانيتها سنة بعد سنة، فتخسر الخدمات والشرعية معاً.<br><br><b>الدروس:</b> الحسم الأمني المؤجّل يدفع فوائته مرتين."}, {"id": "N11_client_economy", "when": {"min": {"r_gulf": 74, "cash": 12}, "max": {"sov": 48}}, "title": "الاقتصاد الذي يملكه المانحون", "desc": "الخزينة ممتلئة والودائع خليجية والاستثمارات متاحة — والقرار العام يُتخذ في عواصم أخرى: شروط على الموازنة، وتحالفات على مقاس المموّل، وعقود لأصدقاء الممول. سوريا «محميّة مالياً» لا دولة شراكة.<br><br><b>الفرق بين الصديق والتبعية:</b> أن تملك خطة وطنية تُموَّل، لا مشروعاً يأتي ممولاً بخطة."}, {"id": "N12_civil_unrest", "when": {"min": {"frag": 62}, "max": {"coh": 48}}, "title": "سوريا المتوترة: سلام هشّ على فوهة", "desc": "ثلاث سنوات من الاحتقان الأهلي: اغتيالات على الهوية، ومظالم متبادلة (الساحل، السويداء، الجزيرة، العشائر)، وميليشيات بأسماء قانونية، وعدالة لم تُقنع أحداً. الدولة تملك العاصمة، والمجتمع يملك ذاكرة جريحة.<br><br><b>كل ما تحتاجه للانفجار:</b> حادث واحد لا تحقيق فيه."}, {"id": "T2_identification_pact", "title": "تسوية الهوية: دينٌ للدولة وقانونٌ للناس", "desc": "لم يُلغَ الوعد ولم يُنفَّذ حرفياً: «الفقه مصدر رئيسي» بلا آلية نقض، أحوال الطوائف محفوظة، وقانون أسر مُعدَّل جزئياً. وصيغة وسط تُبقي سوريا قابلة للحكم — وأول من يحتج عليها الطرفان معاً.", "when": {"min": {"shr": 38, "coh": 55, "dem": 50}, "max": {"shr": 66, "frag": 46}}}, {"id": "N13_isolated", "when": {"max": {"dip": 38, "r_gulf": 45, "r_us": 40}}, "title": "بلد محاصر بنوايا حسنة", "desc": "مواقف مبدئية بلا تحالفات: عقوبات عادت جزئياً، والاستثمار خائف، والخطوط الجوية قليلة، والدعم الإقليمي مشروط. السيادة محفوظة في الخطاب، والدولة تدفع ثمنها في الصيدلية والكهرباء.<br><br><b>السيادة بلا شبكة مصالح</b> تتحول إلى عزلة، والعزلة إلى اقتصاد ظل."}, {"id": "N14_endurance", "when": {"min": {"leg": 45}, "max": {"frag": 55}}, "title": "الصمود: لم تسقط، ولم تبنِ", "desc": "ديسمبر 2027: لا حرب أهلية، لا انهيار مالي، لا انقلاب، لا تقسيم. وهذا في حد ذاته نتيجة — فبدائل 2025 كانت أسوأ بكثير. لكن الدولة ما زالت تدير بالأولويات الطارئة، والملفات الكبرى (الجنوب، السويداء، الدستور، الكهرباء، الفقر) معلّقة على 2028.<br><br><b>هذه نهاية مؤقتة:</b> في محاكاة بهذا العمق، النجاة ليست نجاحاً، لكنها ثمن الجولة التالية."}, {"id": "N15_default", "when": {}, "title": "دولة على ورق: ثلاث سنوات ولم يكتمل شيء", "desc": "الوزارات تعمل، والمراسيم تُنشر، والعلم يرفرف — لكن العقد الاجتماعي لم يُكتب، والأمن لم يُحتكر، والاقتصاد لم يتعافَ، والمكوّنات لم تطمئن. هذا ما يحدث عندما تُدار المرحلة بردّات الفعل: كل قرار صحيح في لحظته، ومجموعها لا يصنع دولة.<br><br><b>هذه هي النهاية المرجعية للواقع (54/100):</b> لا نصر ولا انهيار — مسار معلّق على قرار لم يُتخذ بعد."}], "news": [{"at": 0, "t": "<b>8 ديسمبر 2024</b> — سقوط النظام ودخول قوات الإدارة الجديدة دمشق؛ <b>9 ديسمبر</b> حكومة تصريف أعمال برئاسة محمد البشير."}, {"at": 0, "t": "<b>عملية «سهم الباشان»</b>: تدمير <b>70–80%</b> من السلاح الاستراتيجي السوري وإبديد البحرية بالكامل، واحتلال المنطقة العازلة في القنيطرة."}, {"at": 0, "t": "<b>12 ديسمبر 2024</b> — لجنة <b>قضائية وحقوقية</b> لمراجعة دستور 2012؛ المادة الثالثة («الفقه الإسلامي مصدر رئيسي للتشريع») تبقى خارج النقاش العلني."}, {"at": 1, "t": "<b>24 ديسمبر 2024</b> — إعلان حلّ الفصائل ودمجها في وزارة الدفاع (باستثناء قسد)؛ ترقيات لضباط جدد نهاية الشهر."}, {"at": 1, "t": "إسرائيل تقصف مخازن صواريخ ومعامل في مصياف والسفيرة؛ <b>التهجير الأول</b> لعائلات قرب خط الفصل."}, {"at": 2, "t": "<b>29 يناير 2025</b> — مؤتمر النصر: تعيين الشرع رئيساً للمرحلة الانتقالية، إلغاء دستور 2012، حلّ البرلمان والائتلاف."}, {"at": 2, "t": "البيت الأبيض (إدارة بايدن) يراقب رفع العقوبات؛ لقاءات أمريكية أولية في دمشق؛ <b>تغيّب واسع للموظفين</b> عن الدوائر."}, {"at": 3, "t": "<b>28 فبراير 2025</b> — اشتباكات جرمانا: قتيل من الأمن و9 جرحى، ثم اتفاق على تقاسم المسؤولية الأمنية مع قيادات محلية."}, {"at": 3, "t": "<b>6–12 مارس 2025</b> — اشتباكات الساحل ومجازر موثقة: <b>1,383–1,700 قتيل</b> بحسب المرصد؛ تحقيق رويترز لاحقاً: <b>~1,500 علوي</b>."}, {"at": 3, "t": "<b>10 مارس 2025</b> — اتفاق وقف إطلاق النار والدمج مع قسد (الشرع–عبدي)؛ <b>13 مارس</b> — الإعلان الدستوري الانتقالي (5 سنوات، نظام رئاسي، الفقه مصدر رئيسي)."}, {"at": 3, "t": "<b>13 مارس 2025</b> — <b>الإعلان الدستوري</b>: مقدمة و52 مادة في 4 أبواب؛ الباب الأول يُبقي <b>الفقه مصدراً رئيسياً</b> ويشترط <b>ديانة الرئيس الإسلام</b>."}, {"at": 3, "t": "<b>28 مارس 2025</b> — مرسوم تعيين <b>أسامة الرفاعي مفتياً للجمهورية</b>: إعادة منصب أُلغي في نوفمبر 2021 لصالح «مجلس إفتاء» تابع للأوقاف."}, {"at": 4, "t": "<b>13–14 مايو 2025</b> — زيارة الرياض ولقاء ترامب: الإعلان عن رفع العقوبات؛ <b>20 مايو</b> الاتحاد الأوروبي يرفع العقوبات؛ <b>30 يونيو</b> مرسوم أمريكي تنفيذي."}, {"at": 4, "t": "<b>17 مايو 2025</b> — مراسيم إنشاء <b>الهيئة الوطنية للعدالة الانتقالية</b> و<b>الهيئة الوطنية للمفقودين</b>."}, {"at": 4, "t": "أعمال تخريب في معلولا وسرقة مواقع أثرية؛ تقرير أمريكي: 85–90% من الآثار السورية تحتاج تدخلاً."}, {"at": 5, "t": "موجة اغتيالات وكمائن للفلول في حماة وطرطوس؛ مخططات أمنية لضباط سابقين تُحبط؛ احتقان في قرى الساحل."}, {"at": 5, "t": "قانون «محرّمين» يفصل عشرات الآلاف من موظفي الدولة؛ إعادة هيكلة في التربية والداخلية؛ نقابات تحت الحراسة."}, {"at": 5, "t": "<b>18 مايو 2025</b> — <b>عبد الرحيم عطّون</b> (رئيس مجلس الشريعة في هيئة تحرير الشام سابقاً) رئيساً <b>لمكتب الاستشارات الدينية في الرئاسة</b>."}, {"at": 5, "t": "<b>مايو 2025</b> — الرئيس عن تطبيق الشريعة: «<b>القرار يعود للخبراء؛ إن أجازوه فعليّ تنفيذهم</b>». صيغة تُبقي الوعد وتُرجئ التنفيذ."}, {"at": 6, "t": "<b>9 يوليو 2025</b> — إنشاء <b>المجلس الأعلى للتنمية الاقتصادية</b>؛ أول فائض موازنة منذ 13 سنة؛ <b>ميساء صبري</b> حاكمة للمصرف المركزي."}, {"at": 6, "t": "اتفاق على استجرار <b>الغاز التركي عبر كلس–حلب</b>؛ الكهرباء تتحسن ثم تنخفض مجدداً؛ وعود بـ<b>12 غيغاواط</b>."}, {"at": 7, "t": "<b>13–24 يوليو 2025</b> — انفجار السويداء: اشتباكات درزية–عشائرية ثم تدخل حكومي؛ <b>~40 غارة إسرائيلية</b> خلال أسبوع منها <b>القيادة العامة بدمشق</b>؛ انسحاب الجيش من السويداء في 16 يوليو."}, {"at": 7, "t": "حصيلة ملف السويداء (NYT): <b>+1,300 قتيل</b> (منهم <b>768 مدنياً بإعدامات ميدانية</b>) و<b>200,000 نازح</b>؛ الهجري يرفض اتفاق 24 يوليو."}, {"at": 8, "t": "<b>20 أغسطس 2025</b> — أول لقاء مباشر سوري–إسرائيلي في باريس؛ <b>توبيخ +100 من الموالين</b> بتهمة الفساد واستغلال النفوذ."}, {"at": 8, "t": "تركيا: مشاورات حول الجيش الوطني الشمالي؛ أنقرة تشترط «دمجاً لا شراكة»؛ استمرار الانتهاكات في عفرين."}, {"at": 8, "t": "<b>6 أغسطس 2026</b> — تفجير حافلة صغيرة في <b>جرمانا</b> (شارع الروضة) و<b>3 قتلى و14 جريحاً</b> من المدنيين الدروز؛ جماعة «<b>منبر أنصار الرسول</b>» تعلن المسؤولية (تمرد جهادي على السلطة الجديدة)."}, {"at": 9, "t": "<b>22 سبتمبر 2025</b> — أول خطاب لرئيس سوري أمام الجمعية العامة منذ 58 سنة؛ لقاء روبيو؛ <b>9 سبتمبر</b> جولة تفاوض في لندن."}, {"at": 9, "t": "اشتباكات في الشيخ مقصود والأشرفية بحلب بين قوات الحكومة وقسد؛ نازحون داخل المدينة؛ هدن متقطعة."}, {"at": 10, "t": "<b>15 أكتوبر 2025</b> — لقاء بوتين–الشرع في موسكو: «إعادة تعريف العلاقة»؛ الأسد ما زال في موسكو بلا تسليم."}, {"at": 10, "t": "انتخابات أكتوبر 2025 بنظام هرمي: <b>119 من 140 مقعداً</b> (تأجيل الرقة والحسكة)؛ <b>6 نساء و10 من الأقليات</b>؛ <b>6 أكتوبر</b> إغلاق مكتب جمال الشرع."}, {"at": 11, "t": "<b>6–10 نوفمبر 2025</b> — البيت الأبيض: انضمام سوريا للتحالف الدولي ضد داعش؛ تمديد إعفاء قانون قيصر 180 يوماً؛ <b>7 نوفمبر</b> شطب اسم الشرع من قائمة SDGT و<b>القرار الأممي 2799</b>."}, {"at": 11, "t": "<b>19 نوفمبر 2025</b> — نتنياهو في القنيطرة: «لن نسمح بتهديد الدروز»؛ مداهمة بيت جن (13 قتيلاً)؛ <b>19 مستوطنة جديدة</b> في الجولان."}, {"at": 12, "t": "<b>18 ديسمبر 2025</b> — إلغاء قانون قيصر نهائياً (الشيوخ <b>77–20</b>) ضمن موازنة الدفاع؛ <b>29 ديسمبر</b>: الليرة الجديدة بحذف صفرين."}, {"at": 12, "t": "شتاء قارس وجفاف تاريخي: <b>14.2 مليون</b> غير آمنين غذائياً (<b>9.1 مليون</b> جوع حاد)؛ عجز محروقات وطوابير."}, {"at": 12, "t": "<b>ديسمبر 2025</b> — <b>قانون الأسر 59/1953</b> ما زال نافذاً: الأحوال الشخصية للمسلمين أمام محاكم شرعية، وشهادة المرأة أمامها <b>بنصف شهادة الرجل</b>."}, {"at": 13, "t": "<b>6–27 يناير 2026</b> — عملية شمال شرق: استعادة دير حافر وحقل العمر ومخيم الهول والطبقة والسدود؛ <b>148,000 نازح</b> و23 قتيلاً في معارك حلب."}, {"at": 13, "t": "<b>16 يناير 2026</b> — مرسوم الحقوق الكردية (لغة وطنية، النوروز، جنسية المكتومين)؛ <b>30 يناير</b>: اتفاق شامل لدمج قسد إدارياً وعسكرياً."}, {"at": 14, "t": "<b>4 فبراير 2026</b> — عقد الغاز البحري: شركة النفط السورية + <b>شيفرون</b> + <b>قطر للطاقة</b>؛ <b>7 فبراير</b> اتفاقيات سعودية (مطارات حلب، فلايناس سوريا، SilkLink)."}, {"at": 14, "t": "<b>12 و15 فبراير 2026</b> — انسحاب أمريكي من التنف والشدادي؛ <b>22 فبراير</b> تفريغ مخيم الهول؛ تسلّم السجون والمخيمات."}, {"at": 15, "t": "<b>28 فبراير 2026</b> — صاروخ إيراني على السويداء (4 قتلى)؛ تل أبيب ترد داخل الجنوب؛ دمشق تعلن حيادها في حرب الإقليم."}, {"at": 15, "t": "استطلاع يناير 2026 (YouGov/CSA): <b>69%</b> يقيّمون أداء الرئيس جيداً، <b>59%</b> يرون السلام مع إسرائيل ممكناً، و<b>18%</b> فقط مع التطبيع."}, {"at": 16, "t": "<b>2 أبريل 2026</b> — «الردع الأردني»: غارات أردنية على شحبا والكفر وعرمان ضد تجارة المخدرات؛ احتجاج رسمي سوري."}, {"at": 16, "t": "توتر في السويداء: اقتتال داخلي، ومجلس إدارة محلي (جبل الباشان)؛ استمرار إغلاق الطرق وحصار اقتصادي متبادل."}, {"at": 17, "t": "<b>9 مايو 2026</b> — أول تعديل وزاري: إقالة ماهر الشرع من الأمانة العامة للرئاسة وتعيين عبد الرحمن العامر؛ «إعادة بناء ثقة»."}, {"at": 18, "t": "حرب إسرائيل–إيران تمرّ وأجواء سوريا معبراً: صواريخ وشظايا، وخلايا مرتبطة بحزب الله في حوض اليرموك؛ دمشق ترفع شكوى «عدم امتثال نووي»."}, {"at": 18, "t": "هجمات متكررة: إزرع (4 قتلى، 3 مارس)، قافلة حمص، وكمائن في الرقة والميادين؛ عمليات مشتركة مع التحالف."}, {"at": 19, "t": "<b>12 يوليو 2026</b> — أول مجلس شعب بعد الأسد (تأجيل 6 أيام)؛ نظامه الداخلي يمنح حصانة ويمنع الحلّ؛ <b>23 يوليو</b>: يمين 11 قاضياً في المحكمة الدستورية بتعيين رئاسي."}, {"at": 19, "t": "<b>7–19 يوليو 2026</b> — مرسوم تشكيل <b>المحكمة الدستورية العليا (7 أعضاء)</b> ورئيسها عصام الخليف وحلف اليمين؛ لا آلية فقهية لمراجعة القوانين."}, {"at": 20, "t": "<b>12 أغسطس 2026</b> — قمة الناتو في أنقرة حول الوجود الأمريكي في سوريا؛ <b>24 أغسطس</b>: <b>شطب سوريا من قائمة الدول الراعية للإرهاب</b>."}, {"at": 20, "t": "<b>25 أغسطس 2026</b> — حلّ قوات سوريا الديمقراطية ودمج <b>10–12 ألف</b> مقاتل؛ قوام الجيش <b>180–182 ألفاً</b>؛ <b>27 أغسطس</b>: عبدي مستشاراً للرئيس."}, {"at": 21, "t": "<b>3 سبتمبر 2026</b> — إعلان تدمير آخر بقايا السلاح الكيمياوي السوري؛ <b>9 أغسطس</b> اتفاق القواعد الروسية؛ <b>11 أغسطس</b> حكم غيابي بإعدام الأسد."}, {"at": 21, "t": "<b>21–29 أغسطس 2026</b> — الحرس الوطني يمنع طلاب السويداء من الامتحانات ويغلق أم زيتون؛ <b>27 أغسطس</b> انفجار مستودع غاز حمص؛ <b>5 سبتمبر</b> محاولة اغتيال محافظ حمص."}, {"at": 21, "t": "<b>13 سبتمبر 2026</b> — احتجاجات على أسعار الوقود؛ <b>16 سبتمبر</b>: إلغاء محكمة أمن الدولة العليا؛ هجمات حافلات حمص (7 قتلى)."}, {"at": 21, "t": "<b>16 سبتمبر 2026</b> — إلغاء <b>محكمة مكافحة الإرهاب</b> (2012) دون قانون بديل؛ و<b>2026</b>: محكمة دمشق تحكم <b>بالمؤبد</b> على المفتي الأسبق أحمد حسون."}, {"at": 22, "t": "<b>18 أكتوبر 2026</b> — صندوق ائتماني <b>300 مليون $</b> في مجموعة البنك الدولي؛ <b>25 أكتوبر</b>: اتفاقية <b>Eagle Hills</b> (3 مليار $)؛ عقود غاز ومطارات."}, {"at": 22, "t": "<b>26 أكتوبر 2026</b> — غارات أردنية على درعا: 8 قتلى مدنيين و<b>إغلاق معبر جابر/نصيب</b>؛ <b>28 أكتوبر</b>: لجنة تحقيق مشتركة وإعادة فتح."}, {"at": 23, "t": "<b>4 نوفمبر 2026</b> — <b>معاهدة دفاع سعودي–سوري</b> بعد قمة الرياض؛ <b>9 نوفمبر</b>: إرسال جنود سوريين إلى السعودية."}, {"at": 23, "t": "نوفمبر 2026: تصاعد اشتباكات السويداء ومجزرة بصرى (18+)؛ <b>5 نوفمبر</b> تفاهم برعاية أمريكية لم تلتزم دمشق به؛ غارة إسرائيلية على بيت جن (15 نوفمبر)."}, {"at": 24, "t": "<b>مسار متوقع</b> — يناير 2027: ضغط أمريكي لجولة حسم في ملف الجنوب؛ البرل     if (advs.length < 2) { alert("اختر مستشارين اثنين على الأقل."); return; }
    S.cabinet = advs;
    advs.forEach(function (a) { if (a.cash) S.res.cash += a.cash; });
    var dcv = document.querySelector('input[name=doc]:checked');
    var doc = DOCTRINES.filter(function (x) { return x.id === dcv.value; })[0];
    S.doctrine = doc; SY.applyEff(S, doc.eff); SY.addFlags(S, ["doc_" + doc.id]);
    S.line.push({ m: 0, leg: S.st.leg, coh: S.st.coh, eco: S.st.eco, mil: S.st.mil, sov: S.st.sov, dip: S.st.dip, sec: S.st.sec, dem: S.st.dem, srv: S.st.srv, press: S.st.press, frag: S.st.frag, shr: S.st.shr, cash: S.res.cash });
    nextMonth(true);
  }
  function resume() {
    try {
      var raw = JSON.parse(localStorage.getItem(LS));
      if (!raw) return;
      S = raw;
      S.rng = (function (seed) {
        var s = seed >>> 0;
        return function () { s += 0x6D2B79F5; s >>>= 0; var t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
      })(S.seed + S.month * 977);
      showPlay();
    } catch (e) { alert("تعذّر استئناف الجولة."); }
  }
  function showPlay() {
    var ev = SY.pickEvent(S, D);
    if (!ev) return nextMonth(false);
    S.used[ev.id] = 1; S.seen.push(ev.id);
    lastEv = ev; lastRes = null;
    view = "play";
    render([]);
    save();
  }
  function save() {
    if (!S) return;
    try {
      var c = JSON.parse(JSON.stringify(S));
      delete c.rng;
      localStorage.setItem(LS, JSON.stringify(c));
    } catch (e) {}
  }

  /* ============================ دورة اللعب ============================ */
  function nextMonth(first) {
    var notes = [];
    if (!first) {
      var a = SY.advance(S);
      notes = a.msgs || [];
      var col = SY.collapse(S);
      if (col) { S.over = col; return showEnd(); }
      if (S.month >= SY.MONTHS_TOTAL - 1) return showEnd();
    }
    var ev = SY.pickEvent(S, D);
    if (!ev) {
      // شهر بلا حدث: أثر انجراف فقط
      S.month++;
      SY.applyEff(S, SY.drift(S));
      return nextMonth(false);
    }
    S.used[ev.id] = 1;
    S.seen.push(ev.id);
    lastEv = ev; lastRes = null;
    view = "play";
    render(notes);
    save();
  }

  function render(notes) {

      '<div class="monthbox"><div><div class="mt">' + SY.monthLabel(S.month) + '</div><div class="mn">الشهر ' + (S.month + 1) + " / " + SY.MONTHS_TOTAL + " · " + esc(S.diff === "easy" ? "سهل" : S.diff === "hard" ? "قاسٍ" : "واقعي") + "</div></div>" +
      '<div style="width:150px"><div class="gbar"><i style="width:' + Math.round((S.month / (SY.MONTHS_TOTAL - 1)) * 100) + '%;background:linear-gradient(90deg,#c99b2e,#e7bf5c)"></i></div></div></div>' +

    h += '<div class="wrap"><div class="grid"><div class="main">';

    var nb = newsFor(S.month);

      notes.forEach(function (n) { h += '<div class="note">' + esc(n.t) + ": " + esc(n.x) + "</div>"; });

      "</div><h2>" + esc(ev.title) + "</h2>" +
      '<div class="brief">' + ev.brief + "</div>" +
      (ev.facts && ev.facts.length ? '<ul class="facts">' + ev.facts.map(function (f) { return "<li>" + f + "</li>"; }).join("") + "</ul>" : "") +
      "</div>";

    /* --- النتيجة أو الخيارات --- */
    if (!lastRes) {
      h += '<div class="opts">' + ev.options.map(function (o, i) {
        var p = SY.chance(S, o);
        var cost = [];
        if (o.cost) {
          if (o.cost.cash) cost.push('<span class="pill cost">' + (o.cost.cash > 0 ? "+" : "") + o.cost.cash + " مليار $</span>");

        }

        return '<button class="opt" data-i="' + i + '"><span class="key">' + (i + 1) + "</span><b>" + esc(o.t) + "</b><small>" + (o.d || "") + "</small>" +
          '<div class="optmeta">' +
          (p === null ? '<span class="pill lock">بلا مقامرة — النتيجة حتمية</span>' : '<span class="pill ' + pcls + '">فرصة النجاح: ' + p + "%</span>") +
          cost.join("") + "</div></button>";
      }).join("") + "</div>";
    } else {
      var r = lastRes;
      var tcls = "t-" + (r.tier === "ok" ? "ok" : r.tier === "mid" ? "mid" : "bad");
      var head = r.roll ? '<div class="ot">' + (r.tier === "ok" ? "✓ نجح القرار" : r.tier === "mid" ? "◐ نجح جزئياً" : "✗ انقلب القرار") + ' <span class="tiny">(' + r.roll.p + "% متوقع · الرمية " + r.roll.r + ")</span></div>" : '<div class="ot">نُفّذ القرار</div>';
      h += '<div class="card"><h2>النتيجة</h2><div class="outcome ' + tcls + '">' + head + "<div>" + r.txt + '</div><div class="effs">' + effPills(r.eff) + "</div></div>" +
        (lastRes.decree ? '<div class="reality"><div class="rt">مرسوم اضطراري</div>رصيدك السياسي لم يكن يكفي هذا القرار فمرَّ بمرسوم: ارتفع الاحتقان وتآكلت الشرعية المؤسساتية بمقدار العجز (' + lastRes.decree + ').</div>' : "") +
        (lastEv.real ? '<div class="reality"><div class="rt">الواقع — ما جرى فعلاً</div>' + lastEv.real + "</div>" : "") +
        '<div class="nextrow"><div class="tiny">' + pendingHint() + '</div><button class="btn" id="nextBtn">الشهر التالي ←</button></div></div>';

    h += "</div>"; // main

    /* --- الشريط الجانبي --- */
    h += '<div class="side">' + sidebar() + "</div>";
    h += "</div></div>";

    document.getElementById("app").innerHTML = h;
    bind();

    window.scrollTo(0, 0);
  }

  function pendingHint() {
    var n = S.delay.filter(function (d) { return d.at <= S.month + 4; }).length;
    var q = S.queue.length;
    var bits = [];
    if (n) bits.push("‏" + n + " أثراً متأجلاً سيظهر خلال 4 أشهر");
    if (q) bits.push("‏" + q + " حدثاً مفتوحاً بقرارك");
    if (S.st.press > 70) bits.push("⚠ الضغط الإسرائيلي يستنزف السيادة والاقتصاد شهرياً");
    if (S.thr.isis > 65) bits.push("⚠ نشاط داعش مرتفع");
    if (S.res.cap < 25) bits.push("⚠ رصيدك السياسي شبه نفد");
    return bits.join(" · ") || "لا التزامات معلّقة";
  }

  function newsFor(m) {
    return (D.news || []).filter(function (n) { return n.at === m; });
  }

  /* ============================ الشريط الجانبي ============================ */
  function sidebar() {
    var h = '<div class="tabs">' +
      [["gauges", "المؤشرات"], ["state", "حالة الدولة"], ["chart", "المنحنى"], ["arch", "الأرشيف"]].map(function (t) {
        return '<button class="tab ' + (tab === t[0] ? "on" : "") + '" data-tab="' + t[0] + '">' + t[1] + "</button>";
      }).join("") + "</div>";
    if (tab === "gauges") h += panelGauges();
    else if (tab === "state") h += panelState();
    else if (tab === "chart") h += '<div class="card"><h2>تطور المؤشرات</h2><canvas id="chart"></canvas><div class="legend" id="legend"></div></div>';
    else h += panelArchive();
    return h;
  }

      var barColor = neg ? "linear-gradient(90deg,#7a2b2b,#e8615f)" : "linear-gradient(90deg," + colorOf(k) + "88," + colorOf(k) + ")";
      var meta = SY.STATS[k] || SY.NEG[k] || SY.AXIS[k] || {};
      return '<div class="g ' + (neg ? "neg " : "") + (axis ? "axis" : "") + '" title="' + esc(meta.s || "") + '">' +
        '<div class="gl"><span>' + (meta.ic || "") + " " + esc(nameOf(k)) + "</span><span>" + dlab + '<span class="gv">' + v + "</span></span></div>" +
        '<div class="gbar"><i style="width:' + v + '%;background:' + barColor + '"></i></div></div>';
    }
    var h = '<div class="card tight"><div class="gauges">' +

      '<div class="resrow"><div class="res ' + (S.res.cash < 1 ? "warn" : "") + '"><b>' + S.res.cash.toFixed(1) + "</b><span>خزينة (مليار $)</span></div>" +
      '<div class="res ' + (S.res.cap < 25 ? "warn" : "") + '"><b>' + Math.round(S.res.cap) + "</b><span>رصيد سياسي</span></div></div>" +
      '<div class="tiny" style="margin-top:8px">المؤشرات الحمراء: الأعلى فيها أسوأ. مرّر الفأرة على أي مؤشر لترى معناه.</div></div>';
    return h;
  }

  }

      }).join("") + "</div>" +

      }).join("") + "</div>" +

        return '<div class="row"><span class="rn">' + SY.THR[k] + "</span>" + bar(S.thr[k], "thr") + '<span class="val">' + S.thr[k] + "</span></div>";
      }).join("") + "</div>" +

  function panelArchive() {
    if (!S.log.length) return '<div class="card tight"><span class="tiny">لم تتخذ قراراً بعد.</span></div>';
    var items = S.log.slice().reverse().map(function (l) {
      var tg = l.tier ? '<span class="tiertag ' + l.tier + '">' + (l.tier === "ok" ? "نجح" : l.tier === "mid" ? "جزئي" : "انقلب") + " " + l.p + "%</span>" : "";
      return '<div class="li"><div class="lh"><span>' + esc(l.month) + " · " + esc(l.cat || "") + "</span>" + tg + "</div>" +
        '<div class="lt">' + esc(l.ev) + '</div><div class="lo">← ' + esc(l.opt) + '</div><div class="lx">' + esc(l.txt) + '</div><div class="effs">' + effPills(l.eff) + "</div></div>";
    }).join("");

  /* ============================ الرسم ============================ */
  function drawChart() {
    var c = document.getElementById("chart");
    if (!c) return;
    var dpr = window.devicePixelRatio || 1;
    var W = c.clientWidth, H = 210;
    c.width = W * dpr; c.height = H * dpr;
    var x = c.getContext("2d"); x.scale(dpr, dpr);
    x.clearRect(0, 0, W, H);
    x.strokeStyle = "#1c2634"; x.lineWidth = 1;
    for (var i = 0; i <= 4; i++) { var y = (H / 4) * i; x.beginPath(); x.moveTo(0, y); x.lineTo(W, y); x.stroke(); }
    var pts = S.line;
    if (pts.length < 2) { x.fillStyle = "#63768c"; x.fillText("لا بيانات كافية", 10, 30); return; }
    function X(i) { return W - (i / (SY.MONTHS_TOTAL - 1)) * W; } // RTL: الزمن من اليمين
    var keys = ["leg", "coh", "eco", "sov", "mil", "press", "shr"];
    keys.forEach(function (k) {
      x.beginPath(); x.strokeStyle = (k === "press") ? "#e8615f" : colorOf(k); x.lineWidth = 1.8;
      x.setLineDash(k === "shr" ? [6, 4] : []);
      pts.forEach(function (p, i) { var px = X(p.m), py = H - (p[k] / 100) * H; if (i === 0) x.moveTo(px, py); else x.lineTo(px, py); });
      x.stroke();
    });
    x.setLineDash([]);
    var lg = document.getElementById("legend");
    if (lg) lg.innerHTML = keys.map(function (k) {
      return "<span><i style='background:" + (k === "press" ? "#e8615f" : colorOf(k)) + "'></i>" + nameOf(k) + "</span>";
    }).join("");
  }

  /* ============================ الأحداث والقرارات ============================ */
  function choose(i) {
    if (!lastEv || lastRes) return;
    var o = lastEv.options[i];
    if (!o) return;
    if (o.cost && o.cost.cap && S.res.cap + o.cost.cap < 0 && !confirm("رصيدك السياسي لا يكفي لهذا القرار. تريد المضي رغم ذلك؟")) return;
    lastRes = SY.resolve(S, lastEv, o);
    view = "result";
    render([]);
    save();
  }
  function bind() {
    Array.prototype.forEach.call(document.querySelectorAll(".opt"), function (b) { b.onclick = function () { choose(+b.getAttribute("data-i")); }; });
    var n = document.getElementById("nextBtn"); if (n) n.onclick = function () { lastRes = null; nextMonth(false); };
    var s = document.getElementById("saveBtn"); if (s) s.onclick = function () { save(); s.textContent = "✓ حُفظ"; };
    var rp = document.getElementById("reportBtn"); if (rp) rp.onclick = downloadReport;
    var rb = document.getElementById("restartBtn"); if (rb) rb.onclick = function () { if (confirm("بدء جولة جديدة؟")) { localStorage.removeItem(LS); showStart(); } };
    var hb = document.getElementById("helpBtn"); if (hb) hb.onclick = function () { showStart(); };
    Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (t) {
      t.onclick = function () { tab = t.getAttribute("data-tab"); render([]); };
    });
  }

  /* ============================ تقرير ============================ */
  function reportText() {
    var sc = SY.score(S), L = [];
    L.push("محاكي قرار سوريا — تقرير القيادة");
    L.push("الجولة: 8 ديسمبر 2024 ← " + SY.monthLabel(S.month) + "   |   البذرة: " + S.seed + "   |   الصعوبة: " + S.diff);
    L.push("العقيدة: " + (S.doctrine ? S.doctrine.t : "-") + "   المستشرون: " + S.cabinet.map(function (a) { return a.t; }).join("، "));
    L.push("");
    L.push("=== المحصلة ===");
    L.push("التقدير: " + sc.grade + "  (" + sc.final + "/100)");
    Object.keys(SY.STATS).forEach(function (k) { L.push(nameOf(k) + ": " + S.st[k]); });
    Object.keys(SY.NEG).forEach(function (k) { L.push(nameOf(k) + ": " + S.st[k]); });
    Object.keys(SY.AXIS).forEach(function (k) { L.push(nameOf(k) + ": " + S.st[k] + " (محور محايد)"); });
    L.push("الخزينة: " + S.res.cash + " مليار $   الرصيد السياسي: " + Math.round(S.res.cap));
    L.push("");
    L.push("=== القرارات (" + S.log.length + ") ===");
    S.log.forEach(function (l, i) {
      L.push("\n" + (i + 1) + ") [" + l.month + "] " + l.ev + "  (" + (l.cat || "") + ")");
      L.push("   القرار: " + l.opt + (l.tier ? "  — نتيجة: " + (l.tier === "ok" ? "نجح" : l.tier === "mid" ? "جزئي" : "انقلب") + " (فرصة " + l.p + "%)" : ""));
      L.push("   الأثر: " + Object.keys(l.eff || {}).map(function (k) { return nameOf(k) + " " + (l.eff[k] > 0 ? "+" : "") + l.eff[k]; }).join(" | "));
      L.push("   ما جرى: " + l.txt);
    });
    if (S.over && S.over.id && S.over.id.indexOf("X_") === 0) { L.push("\n=== نهاية مبكرة ==="); L.push(S.over.t + " — " + S.over.d); }
    return L.join("\n");
  }
  function downloadReport() {
    var b = new Blob([reportText()], { type: "text/plain;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(b); a.download = "تقرير-قرارات-سوريا.txt";
    document.body.appendChild(a); a.click(); a.remove();
  }

  /* ============================ النهاية ============================ */
  function showEnd() {
    view = "end";
    var sc = SY.score(S);
    var early = S.over && S.over.id && S.over.id.indexOf("X_") === 0;
    var e = early ? { title: S.over.t, desc: S.over.d } : SY.ending(S, D.endings).end;
    var realNote = "في الواقع (بلا تدخل قرارك): وصلت سوريا إلى نوفمبر 2026 بشرعية أداء جيدة، سيادة منقوصة في الجنوب، اقتصاد ينمو ~10% مع فقر 90%، وبرلمان بانتخاب غير مباشر. التقدير المرجعي للواقع: 54/100.";
    var h = '<div class="wrap"><div class="card finalhead">' +
      '<div class="chip">' + (early ? "نهاية مبكرة — " + SY.monthLabel(S.month) : "النهاية — ديسمبر 2027") + "</div>" +
      '<div class="big">' + esc(e.title) + "</div>" +
      '<p style="max-width:820px;margin:0 auto">' + e.desc + "</p>" +
      '<div class="scorebox"><div><b>' + sc.grade + "</b><span>التقدير</span></div>" +
      "<div><b>" + sc.final + "</b><span>النتيجة من 100</span></div>" +
      "<div><b>" + sc.avg + "</b><span>متوسط المؤشرات</span></div>" +
      "<div><b>" + S.st.press + "</b><span>الضغط الإسرائيلي</span></div>" +
      "<div><b>" + Math.round(sc.compAvg) + "</b><span>ثقة المكونات</span></div></div>" +
      '<div class="reality" style="max-width:820px;margin:0 auto"><div class="rt">خط المرجع</div>' + realNote + "</div>" +
      '<div style="margin-top:16px"><button class="btn" id="again">جولة جديدة</button> <button class="btn ghost" id="dl">تحميل تقرير قراراتي</button></div></div>';

    h += '<div class="two"><div class="card"><h2>لوحة الحالة النهائية</h2>' +
      Object.keys(SY.STATS).map(function (k) { return '<div class="kv"><span>' + nameOf(k) + "</span><b>" + S.st[k] + "</b></div>"; }).join("") +
      Object.keys(SY.NEG).map(function (k) { return '<div class="kv"><span>' + nameOf(k) + "</span><b>" + S.st[k] + "</b></div>"; }).join("") +
      Object.keys(SY.AXIS).map(function (k) { return '<div class="kv"><span>' + nameOf(k) + "</span><b>" + S.st[k] + "</b></div>"; }).join("") +
      '<div class="kv"><span>الخزينة</span><b>' + S.res.cash + " مليار $</b></div>" +
      '<div class="kv"><span>ما فتحته من مسارات</span><b>' + Object.keys(S.flags).filter(function (x) { return S.flags[x] > 0; }).length + "</b></div></div>" +
      '<div class="card"><h2>تطور المؤشرات عبر 37 شهراً</h2><canvas id="chart"></canvas><div class="legend" id="legend"></div>' +
      '<div class="tiny" style="margin-top:8px">الزمن يتقدم من اليمين إلى اليسار. الخط الأحمر = الضغط الإسرائيلي.</div></div></div>';

    h += '<div class="card"><h2>سجل القرارات (' + S.log.length + ")</h2><div class=\"log\">" +
      S.log.map(function (l, i) {
        var tg = l.tier ? '<span class="tiertag ' + l.tier + '">' + (l.tier === "ok" ? "نجح" : l.tier === "mid" ? "جزئي" : "انقلب") + "</span>" : "";
        return '<div class="li"><div class="lh"><span>#' + (i + 1) + " · " + esc(l.month) + " · " + esc(l.cat || "") + "</span>" + tg + '</div><div class="lt">' + esc(l.ev) + '</div><div class="lo">← ' + esc(l.opt) + '</div><div class="lx">' + esc(l.txt) + "</div></div>";
      }).join("") + "</div></div></div>";

    document.getElementById("app").innerHTML = h;
    document.getElementById("again").onclick = function () { localStorage.removeItem(LS); showStart(); };
    document.getElementById("dl").onclick = downloadReport;
    drawChart();
    window.scrollTo(0, 0);
  }

  /* ============================ إقلاع ============================ */
  function boot(data) {
    D = data;
    var RISK = { "مرتفع": 1, "متوسط": 1, "منخفض": 1 };
    (D.events || []).forEach(function (e) {
      if (!RISK[e.risk]) e.risk = (String(e.risk || "").indexOf("عال") === 0) ? "مرتفع" : "متوسط";
    });
    document.addEventListener("keydown", function (e) {
      if (view === "play" && !lastRes) {
        var k = e.key;
        if (["1", "2", "3", "4", "5"].indexOf(k) >= 0) choose(+k - 1);
        if (["a", "b", "c", "d"].indexOf(k.toLowerCase()) >= 0) choose("abcd".indexOf(k.toLowerCase()));
      } else if (lastRes && e.key === "Enter") { lastRes = null; nextMonth(false); }
    });
    showStart();
  }
  return { boot: boot };
})();
if (typeof SY_DATA !== "undefined") UI.boot(SY_DATA);

</script>
</body>
</html>
